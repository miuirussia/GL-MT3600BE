name: OpenWrt prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ROUTERFW_INPUT_DIR: ${{ github.workspace }}
      ROUTERFW_WORK_DIR: /work
      ROUTERFW_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
      ROUTERFW_KEYS_DIR: /work/keys
      CCACHE_DIR: /work/ccache
      # The toolchain is rebuilt on each runner, so compiler mtimes change.
      CCACHE_COMPILERCHECK: content
      JOBS: '2'
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo install -d -o "$(id -u)" -g "$(id -g)" /work
          sudo bash scripts/install-deps.sh
          df -h /work

      - name: Restore downloads and compiler cache
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /work/downloads
            /work/ccache
          # Cache entries are immutable; save new compiler results after each run.
          key: openwrt-${{ runner.os }}-${{ hashFiles('openwrt.lock.json', 'scripts/build-packages.txt') }}-${{ hashFiles('configs/**', 'patches/**', 'packages/**', 'files/**', 'uci-defaults/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwrt-${{ runner.os }}-${{ hashFiles('openwrt.lock.json', 'scripts/build-packages.txt') }}-${{ hashFiles('configs/**', 'patches/**', 'packages/**', 'files/**', 'uci-defaults/**') }}-
            openwrt-${{ runner.os }}-${{ hashFiles('openwrt.lock.json', 'scripts/build-packages.txt') }}-

      - name: Restore APK signing key
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          if [ -n "$APK_PRIVATE_KEY" ]; then
            install -d -m 700 "$ROUTERFW_KEYS_DIR"
            umask 077
            printf '%s\n' "$APK_PRIVATE_KEY" > "$ROUTERFW_KEYS_DIR/private-key.pem"
          fi

      - name: Configure and test
        run: |
          python3 scripts/builder.py configure
          python3 -m unittest discover -s tests

      - name: Build firmware
        id: firmware
        run: |
          ccache --show-config
          ccache --zero-stats
          python3 scripts/builder.py build

      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.firmware.outcome != 'skipped' }}
        env:
          RESTORED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          ccache_bin=/work/openwrt/staging_dir/host/bin/ccache
          if [ ! -x "$ccache_bin" ]; then
            ccache_bin=ccache
          fi
          {
            echo '### Compiler cache'
            printf 'Restored cache: %s\n\n' "${RESTORED_CACHE_KEY:-none}"
            echo '```text'
            "$ccache_bin" --show-stats --verbose
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save downloads and compiler cache
        if: ${{ !cancelled() && steps.firmware.outcome != 'skipped' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /work/downloads
            /work/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Package release assets
        run: python3 scripts/release-assets.py

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: firmware
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove private key
        if: always()
        run: rm -rf "$ROUTERFW_KEYS_DIR"

  prerelease:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: firmware
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}-{1}', github.run_number, github.run_attempt) }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf 'GL-MT3600BE. Commit: %s\n\nFull build metadata is included in the archive.\n' "$RELEASE_COMMIT" > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$RELEASE_TAG" release/* \
            --target "$RELEASE_COMMIT" \
            --title "GL-MT3600BE $RELEASE_TAG" \
            --prerelease --latest=false \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
